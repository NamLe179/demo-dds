version: '3.8'

services:
  subscriber:
    image: demo-dds-rti:latest
    container_name: rti_subscriber
    network_mode: "host" 
    command: ["./dds_subscriber"] # Tên executable sinh ra từ CMake
    restart: unless-stopped

  publisher:
    image: demo-dds-rti:latest
    container_name: rti_publisher
    network_mode: "host" 
    command: ["./dds_publisher"] # Tên executable sinh ra từ CMake
    restart: unless-stopped
    depends_on:
      - subscriber